<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Scalio — Brand Book (print)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #ECEAE3;
    font-family: "Inter Tight", Helvetica, Arial, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page {
    width: 1280px;
    height: 780px;
    margin: 24px auto;
    background: #F5F2EC;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    break-inside: avoid;
    break-after: page;
    page-break-after: always;
  }
  .page:last-child { break-after: auto; page-break-after: auto; }

  @page {
    size: 1280px 780px;
    margin: 0;
  }
  @media print {
    html, body { background: #fff; }
    .page {
      margin: 0;
      box-shadow: none;
      width: 1280px;
      height: 780px;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="scalio-final.jsx"></script>

<script type="text/babel">
  function PrintApp() {
    const pages = [Cover, LogoPage, Construction, ColorType, DoDont, Applications, Closing];
    return (
      <>
        {pages.map((Page, i) => (
          <div key={i} className="page">
            <Page />
          </div>
        ))}
      </>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<PrintApp />);

  // Auto-print after fonts + render
  (async () => {
    try { await document.fonts.ready; } catch (e) {}
    await new Promise(r => setTimeout(r, 800));
    window.print();
  })();
</script>
</body>
</html>
