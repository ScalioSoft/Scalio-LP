<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Scalio — Brand Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ECEAE3; font-family: "Inter Tight", Helvetica, Arial, sans-serif; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="scalio-final.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas
        title="Scalio · Brand Book v1.0"
        subtitle="Manual de marca final — wordmark, symbol & sistema"
      >
        <DCSection id="cover" title="Capa">
          <DCArtboard id="00" label="Cover" width={1280} height={780}>
            <Cover />
          </DCArtboard>
        </DCSection>

        <DCSection id="marca" title="01 · A marca">
          <DCArtboard id="01" label="Wordmark · Symbol · Lockup" width={1280} height={780}>
            <LogoPage />
          </DCArtboard>
        </DCSection>

        <DCSection id="construcao" title="02 · Construção & clear space">
          <DCArtboard id="02" label="Grid · clear space · sizing" width={1280} height={780}>
            <Construction />
          </DCArtboard>
        </DCSection>

        <DCSection id="cor-tipo" title="03 · Cor & Tipografia">
          <DCArtboard id="03" label="Paleta · type stack" width={1280} height={780}>
            <ColorType />
          </DCArtboard>
        </DCSection>

        <DCSection id="rules" title="04 · Do / Don't">
          <DCArtboard id="04" label="Regras de uso" width={1280} height={780}>
            <DoDont />
          </DCArtboard>
        </DCSection>

        <DCSection id="aplicacoes" title="05 · Aplicações">
          <DCArtboard id="05" label="Onde a marca vive" width={1280} height={780}>
            <Applications />
          </DCArtboard>
        </DCSection>

        <DCSection id="fim" title="Encerramento">
          <DCArtboard id="06" label="Closing" width={1280} height={780}>
            <Closing />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
